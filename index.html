<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Fatwa Ferdiansyah — Data Analyst | Business Intelligence</title>
<style>
:root{
  --surface:#fcfcfb;
  --card:#ffffff;
  --ink:#0b0b0b;
  --ink2:#52514e;
  --muted:#8a8985;
  --line:#e6e5e1;
  --blue:#2a78d6;
  --orange:#eb6834;
  --aqua:#1baf7a;
  --blue-soft:#eaf2fd;
  --orange-soft:#fdefe9;
  --aqua-soft:#e8f7f1;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:12px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:#33322f}
body{background:#33322f;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{appearance:none}
a{color:inherit}

#stage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.slide{
  width:min(1280px, calc(100vw - 48px));
  aspect-ratio:16 / 9;
  max-height:calc(100vh - 48px);
  background:var(--surface);
  position:relative;
  display:none;
  padding:48px 64px 76px;
  flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
  border-radius:6px;
  overflow:hidden;
}
.slide.on{display:flex}

/* ---------- Typography ---------- */
.kicker{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue);font-weight:800;margin-bottom:10px;
}
h1{
  font-size:clamp(36px,4.35vw,56px);
  line-height:1.04;letter-spacing:-.025em;font-weight:850;
}
h2{
  font-size:clamp(24px,2.3vw,32px);
  line-height:1.12;letter-spacing:-.02em;font-weight:800;
  max-width:35ch;
}
h3{font-size:17px;line-height:1.25;font-weight:800}
.sub{
  font-size:15.5px;color:var(--ink2);line-height:1.5;
  margin-top:11px;max-width:78ch;
}
.rule{height:4px;width:64px;background:var(--blue);border-radius:2px;margin:18px 0 20px}

/* ---------- Layout ---------- */
.grid{display:grid;gap:16px;margin-top:18px;min-height:0}
.g2{grid-template-columns:1fr 1fr}
.g25{grid-template-columns:1.1fr .9fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex1{flex:1;min-height:0}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;flex-direction:column;min-width:0;
}
.card.tint{background:var(--blue-soft);border-color:#cfe1f9}
.card.warn{background:var(--orange-soft);border-color:#f8d7c7}
.card.good{background:var(--aqua-soft);border-color:#c7ecdd}

.stat{font-size:clamp(28px,3vw,40px);font-weight:850;letter-spacing:-.025em;line-height:1}
.stat.sm{font-size:27px}
.stat-l{
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:9px;
}
.stat-n{font-size:13.2px;color:var(--ink2);margin-top:9px;line-height:1.42}
.ct{font-size:15px;font-weight:800;margin-bottom:4px}
.cs{font-size:12.2px;color:var(--muted);margin-bottom:10px;line-height:1.4}

/* ---------- Lists / tables ---------- */
ul{list-style:none}
li{
  font-size:13.5px;color:var(--ink2);line-height:1.46;
  padding-left:17px;position:relative;margin-bottom:7px;
}
li::before{
  content:"";position:absolute;left:0;top:.57em;width:6px;height:6px;
  border-radius:50%;background:var(--blue);
}
li.x::before{background:var(--orange)}
li b,.sub b,p b{color:var(--ink);font-weight:750}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;font-size:10.7px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 8px 0;border-bottom:1px solid var(--line);font-weight:800;
}
td{padding:7px 10px 7px 0;border-bottom:1px solid #f1f0ec;color:var(--ink2);vertical-align:top}
td.k{color:var(--ink);font-weight:700}

.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:5px;white-space:nowrap}
.badge.no{background:#fde8e8;color:#a32c2b}
.badge.yes{background:var(--aqua-soft);color:#0f6b4c}

.quote{border-left:4px solid var(--blue);padding:4px 0 4px 16px;font-size:15px;line-height:1.48;color:var(--ink);font-style:italic}
.quote cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.02em}

.tag{
  display:inline-block;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;
  background:#eeedea;color:var(--ink2);margin:0 5px 5px 0;
}
.tag.b{background:var(--blue-soft);color:#1c5cab}
.tag.o{background:var(--orange-soft);color:#a8431f}
.tag.g{background:var(--aqua-soft);color:#0f6b4c}

.callout{
  margin-top:auto;padding:14px 16px;border-radius:10px;background:var(--blue-soft);
  border:1px solid #cfe1f9;font-size:13.5px;color:var(--ink2);line-height:1.48;
}
.eyebrow{
  display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:8px;
}

/* ---------- Cover ---------- */
.cover{justify-content:center}
.cover h1{max-width:760px}
.cover .role{font-size:22px;font-weight:700;color:var(--ink2);letter-spacing:-.01em}
.cover .value{
  max-width:760px;margin-top:18px;font-size:20px;line-height:1.4;color:var(--ink2);
}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}
.chip{
  font-size:12.8px;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:8px 13px;
}
.chip b{color:var(--ink)}
.cover-contact{margin-top:28px;font-size:13px;color:var(--muted)}
.cover-contact a{text-decoration:none}
.cover-contact a:hover{text-decoration:underline;color:var(--blue)}

/* ---------- Project labels ---------- */
.project-badge{
  display:inline-flex;align-items:center;gap:7px;width:max-content;
  padding:6px 10px;border-radius:999px;background:#f1f0ed;color:var(--ink2);
  font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:12px;
}
.project-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.project-badge.portfolio::before{background:var(--orange)}

/* ---------- Navigation ---------- */
#nav{
  position:fixed;right:20px;bottom:18px;display:flex;gap:8px;align-items:center;z-index:9;
}
#nav button{
  background:#fff;border:1px solid #55534f;color:var(--ink);width:36px;height:36px;
  border-radius:8px;font-size:15px;cursor:pointer;line-height:1;
}
#nav button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
#nav button:focus-visible{outline:3px solid rgba(42,120,214,.35);outline-offset:2px}
#pg{color:#d8d6d0;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}

.foot{
  position:absolute;left:64px;right:64px;bottom:20px;display:flex;justify-content:space-between;
  font-size:10.8px;color:var(--muted);letter-spacing:.04em;border-top:1px solid var(--line);padding-top:10px;
}
svg{display:block}

/* ---------- Future project architecture ---------- */
.future-slot{display:none}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  body{background:var(--surface)}
  #stage{padding:0;align-items:flex-start}
  .slide{
    width:100vw;max-height:none;min-height:100vh;height:auto;aspect-ratio:auto;
    border-radius:0;box-shadow:none;padding:34px 24px 74px;overflow:visible;
  }
  .g4,.g3,.g2,.g25{grid-template-columns:1fr}
  .grid{margin-top:14px}
  .sub{font-size:14px}
  li{font-size:13px}
  .foot{left:24px;right:24px}
  .cover .value{font-size:17px}
  #nav{right:12px;bottom:10px}
}

@media (max-width:600px){
  h1{font-size:38px}
  h2{font-size:25px}
  .cover .role{font-size:18px}
  .chips{gap:6px}
  .chip{font-size:12px;padding:7px 10px}
  .stat{font-size:34px}
}

@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:#fff}
  #nav{display:none}
  #stage{display:block;padding:0;min-height:0}
  .slide{
    display:flex!important;width:1280px;height:720px;min-height:720px;max-height:720px;
    box-shadow:none;border-radius:0;page-break-after:always;break-after:page;
  }
}
</style>
</head>

/* ---------- Future project renderer ---------- */
function futureProjectToSlide(p, index){
  const toolTags = (p.tools || []).map(x => `<span class="tag b">${x}</span>`).join("");
  return {
    id:`future-${index+1}`,
    html:`
      <div class="project-badge portfolio">Portfolio Project · Assignment ${String(index+1).padStart(2,"0")}</div>
      <h2>${p.title}</h2>
      <p class="sub">${p.summary || "Assignment case study — to be expanded with the guide, dataset, solution, and result."}</p>
      <div class="grid g2" style="margin-top:20px;flex:1">
        <div class="card">
          <span class="eyebrow">Business question / assignment brief</span>
          <p style="font-size:13.8px;color:var(--ink2);line-height:1.5">${p.assignmentGuide || "Add the assignment brief here."}</p>
          <div style="margin-top:15px">${toolTags}</div>
        </div>
        <div class="card good">
          <span class="eyebrow">Result & evidence</span>
          <p style="font-size:13.8px;color:var(--ink2);line-height:1.5">${p.result || "Add the key finding, recommendation, and evidence here."}</p>
          <div class="callout"><b>Evidence:</b> ${p.evidence || "Add links or file references after upload."}</div>
        </div>
      </div>`
  };
}

const futureSlides = futureProjects.map(futureProjectToSlide);
const deck = [...slides.slice(0,6), ...futureSlides, ...slides.slice(6)];

/* ---------- Render ---------- */
const stage = document.getElementById("stage");
const pg = document.getElementById("pg");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

deck.forEach((p, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (p.cls || "");
  el.dataset.index = i;
  el.setAttribute("aria-label", `${i + 1} of ${deck.length}: ${p.title || p.id}`);
  el.innerHTML = p.html + (p.foot === false ? "" :
    `<div class="foot"><span>${ME.name} · ${ME.role}</span><span>${String(i + 1).padStart(2,"0")} / ${String(deck.length).padStart(2,"0")}</span></div>`);
  stage.appendChild(el);
});

let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(deck.length - 1, i));
  [...stage.children].forEach((s,j) => s.classList.toggle("on", j === cur));
  pg.textContent = `${cur + 1} / ${deck.length}`;
  prev.disabled = cur === 0;
  next.disabled = cur === deck.length - 1;
  prev.setAttribute("aria-disabled", String(cur === 0));
  next.setAttribute("aria-disabled", String(cur === deck.length - 1));
  window.scrollTo({top:0, behavior:"smooth"});
}

prev.onclick = () => show(cur - 1);
next.onclick = () => show(cur + 1);

document.addEventListener("keydown", e => {
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(cur+1)}
  if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(cur-1)}
  if(e.key === "Home"){e.preventDefault();show(0)}
  if(e.key === "End"){e.preventDefault();show(deck.length-1)}
});

show(0);
</script>
