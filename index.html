<title>Fatwa Ferdiansyah — Data Analyst Portfolio</title>
<style>
:root{
  --surface:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8985;
  --line:#e6e5e1; --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a;
  --blue-soft:#eaf2fd; --orange-soft:#fdefe9; --aqua-soft:#e8f7f1;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#33322f;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.slide{
  width:1280px;height:720px;background:var(--surface);position:relative;
  display:none;padding:50px 64px 78px;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.4);
  border-radius:6px;overflow:hidden;
}
.slide.on{display:flex}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:11px}
h1{font-size:56px;line-height:1.06;letter-spacing:-.022em;font-weight:800}
h2{font-size:29px;line-height:1.16;letter-spacing:-.016em;font-weight:750;max-width:24ch}
.sub{font-size:15.5px;color:var(--ink2);line-height:1.5;margin-top:11px;max-width:78ch}
.rule{height:4px;width:64px;background:var(--blue);border-radius:2px;margin:20px 0 22px}
.grid{display:grid;gap:16px;margin-top:18px;flex:1;min-height:0}
.g2{grid-template-columns:1fr 1fr}
.g25{grid-template-columns:1.15fr .85fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column}
.card.tint{background:var(--blue-soft);border-color:#cfe1f9}
.card.warn{background:var(--orange-soft);border-color:#f8d7c7}
.card.good{background:var(--aqua-soft);border-color:#c7ecdd}
.stat{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat.sm{font-size:29px}
.stat-l{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px}
.stat-n{font-size:13.5px;color:var(--ink2);margin-top:9px;line-height:1.45}
.ct{font-size:15px;font-weight:750;margin-bottom:3px}
.cs{font-size:12.5px;color:var(--muted);margin-bottom:11px}
ul{list-style:none}
li{font-size:13.8px;color:var(--ink2);line-height:1.48;padding-left:18px;position:relative;margin-bottom:7px}
li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
li.x::before{background:var(--orange)}
li b,.sub b,p b{color:var(--ink);font-weight:700}
.quote{border-left:4px solid var(--blue);padding:4px 0 4px 18px;font-size:15.5px;line-height:1.55;color:var(--ink);font-style:italic}
.quote cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:8px;letter-spacing:.03em}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:5px 11px;border-radius:20px;background:#eeedea;color:var(--ink2);margin:0 6px 6px 0}
.tag.b{background:var(--blue-soft);color:#1c5cab}
.tag.o{background:var(--orange-soft);color:#a8431f}
.foot{position:absolute;left:64px;right:64px;bottom:22px;display:flex;justify-content:space-between;
  font-size:11.5px;color:var(--muted);letter-spacing:.05em;border-top:1px solid var(--line);padding-top:11px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
   padding:0 10px 9px 0;border-bottom:1px solid var(--line);font-weight:700}
td{padding:7px 10px 7px 0;border-bottom:1px solid #f1f0ec;color:var(--ink2);vertical-align:top}
td.k{color:var(--ink);font-weight:650}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.badge.no{background:#fde8e8;color:#a32c2b}
.badge.yes{background:var(--aqua-soft);color:#0f6b4c}
.cover{justify-content:center}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.chip{font-size:13.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:22px;padding:9px 16px}
.chip b{color:var(--ink)}
#nav{position:fixed;right:20px;bottom:18px;display:flex;gap:8px;align-items:center;z-index:9}
#nav button{background:#fff;border:1px solid #55534f;color:var(--ink);width:34px;height:34px;border-radius:8px;
  font-size:15px;cursor:pointer;line-height:1}
#nav button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
#pg{color:#d8d6d0;font-size:13px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
svg{display:block}
@media print{
  @page{size:1280px 720px;margin:0}
  body{background:#fff}#nav{display:none}#stage{display:block;padding:0;min-height:0}
  .slide{display:flex!important;box-shadow:none;border-radius:0;page-break-after:always;break-after:page;width:1280px;height:720px}
}
</style></head><body>

/* ---------- 5. DAY15 CLEANING ---------- */
{ id:"cleaning", html:`
  <div class="kicker">Project 02 &middot; HR analytics</div>
  <h2>Cleaning is where the judgement calls are &mdash; so I document them</h2>
  <p class="sub">A raw HR extract with duplicates, missing values, impossible ages and inconsistent
  categories. Four decisions that changed the answer:</p>
  <div class="grid g4" style="margin-top:20px;flex:none">
    <div class="card"><div class="stat-l">Rows in</div><div class="stat">1,248</div></div>
    <div class="card"><div class="stat-l">Rows out</div><div class="stat">1,200</div></div>
    <div class="card"><div class="stat-l">Missing values</div><div class="stat">0</div><div class="stat-n">from 8.0% on 4 columns</div></div>
    <div class="card"><div class="stat-l">Stages</div><div class="stat">10</div><div class="stat-n">each with stated reasoning</div></div>
  </div>
  <div class="grid g2" style="margin-top:20px">
    <div class="card">
      <div class="ct">Decisions, not defaults</div>
      <ul>
        <li><b>Not all duplicates are equal.</b> 43 rows were byte-identical; 5 shared an employee ID
            but <b>disagreed on content</b>. I separated the two cases and inspected the 5 conflicts
            individually rather than letting <span style="font-family:monospace;font-size:13px">drop_duplicates()</span> pick a winner.</li>
        <li><b>Ages of 95 and 120 are not outliers &mdash; they are typos.</b> Real age variation
            produces varied numbers; these were two values repeating. I set them to missing and
            imputed, instead of winsorizing a data-entry error into a plausible-looking number.</li>
      </ul>
    </div>
    <div class="card">
      <div class="ct">&nbsp;</div>
      <ul>
        <li><b>I tested whether missingness had a pattern before imputing.</b> Four columns were each
            8.0% missing. I ran a correlation matrix on the missing-value <i>mask</i>: no column went
            missing together with another. That is what justified simple median/mode imputation
            rather than something more defensive.</li>
        <li><b>Encoding matched the variable, not the convenience.</b> Ordinal labels for education
            and performance, one-hot for work mode &mdash; and department left as text because the next
            stage needed it for grouping.</li>
      </ul>
    </div>
  </div>`},

/* ---------- 6. THE SIGNIFICANCE SLIDE ---------- */
{ id:"honesty", html:`
  <div class="kicker">Project 02 &middot; The finding I withdrew</div>
  <h2 style="max-width:36ch">My first answer was wrong &mdash; here is how I found out</h2>
  <div class="grid g25" style="margin-top:18px">
    <div class="card">
      <div class="ct">High-performer rate by department</div>
      <div class="cs">Point estimate with 95% Wilson confidence interval</div>
      ${CHARTS.c_ci}
      <p style="font-size:13.5px;color:var(--ink2);line-height:1.5;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)">
        Same discipline elsewhere: in the student wellbeing data, &ldquo;top students exercise more&rdquo;
        is a <b>2.8-minute-a-day</b> gap (ANOVA p&nbsp;=&nbsp;0.60) &mdash; and its two independent stress
        measures correlate at <b>r&nbsp;=&nbsp;0.004</b>. That dataset carries no signal to find.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;min-height:0">
      <div class="card warn" style="padding:16px 18px">
        <div class="stat-l" style="color:#a8431f">What I first concluded</div>
        <p style="font-size:14px;color:var(--ink2);line-height:1.5;margin-top:4px">
          &ldquo;HR has the highest share of high performers (37.6%) despite the lowest average pay
          &mdash; so pay is not what drives performance.&rdquo; A tidy, quotable insight.</p>
      </div>
      <div class="card" style="padding:16px 18px">
        <div class="stat-l">Then I tested it</div>
        <table style="margin-top:2px">
          <tr><td class="k">HR vs the rest</td><td>p = 0.016</td><td><span class="badge yes">looks real</span></td></tr>
          <tr><td class="k">&hellip;but 6 departments tested</td><td>Bonferroni</td><td></td></tr>
          <tr><td class="k">HR corrected</td><td>p = 0.094</td><td><span class="badge no">not real</span></td></tr>
          <tr style="border:0"><td class="k">&chi;&sup2; omnibus, all 6</td><td>p = 0.234</td><td><span class="badge no">not real</span></td></tr>
        </table>
      </div>
      <div class="card tint" style="padding:16px 18px">
        <div class="stat-l" style="color:#1c5cab">What I reported instead</div>
        <p style="font-size:14px;color:var(--ink2);line-height:1.5;margin-top:4px">
          I picked the highest group <i>first</i> and tested it <i>second</i> &mdash; with six groups, one
          clears the bar by chance. <b>No department differs. I made no recommendation to HR.</b></p>
      </div>
    </div>
  </div>`},

/* ---------- 7. DAY20 COLLECTION ---------- */
{ id:"collection", html:`
  <div class="kicker">Project 03 &middot; Data collection</div>
  <h2 style="max-width:42ch">Three sources, one keyed dataset</h2>
  <p class="sub">File + API + scrape, joined on normalised keys &mdash; and the encoding bug I only caught on a second reading of my own output.</p>
  <div class="grid g3" style="margin-top:22px;flex:none">
    <div class="card"><div class="stat-l">Source 1 &middot; File</div><div class="ct" style="margin-top:4px">CSV import</div>
      <div class="stat-n">Master catalogue loaded with pandas &mdash; the spine every other source joins to.</div></div>
    <div class="card"><div class="stat-l">Source 2 &middot; API</div><div class="ct" style="margin-top:4px">Open Library REST</div>
      <div class="stat-n">Publication year per title. Wrapped with timeout, <span style="font-family:monospace;font-size:12px">raise_for_status()</span> and typed exception handling &mdash; a failed request cannot pass silently.</div></div>
    <div class="card"><div class="stat-l">Source 3 &middot; Scrape</div><div class="ct" style="margin-top:4px">BeautifulSoup</div>
      <div class="stat-n">Price and stock from a static catalogue page, parsed by tag and class.</div></div>
  </div>
  <div class="grid g2" style="margin-top:20px">
    <div class="card">
      <div class="ct">Joining three sources that disagree on formatting</div>
      <ul>
        <li>Normalised <b>lowercase + trimmed</b> join keys before merging, so a stray capital or
            trailing space cannot drop a row</li>
        <li>Composite key <span style="font-family:monospace;font-size:13px">(title, author)</span> for the API join &mdash; title alone is not unique</li>
        <li><b>Left joins throughout</b>: the master list is preserved, and unmatched rows stay
            visible as gaps instead of disappearing</li>
        <li>Brief asked for 2 data-quality issues. I reported <b>3</b>.</li>
      </ul>
    </div>
    <div class="card warn">
      <div class="ct">Re-reading my own output</div>
      <div class="cs">Character encoding &mdash; caught on review, not at the time</div>
      <p style="font-size:14px;color:var(--ink2);line-height:1.55">
        My output showed <b style="font-family:monospace">&Acirc;&pound;51.77</b>, not <b style="font-family:monospace">&pound;51.77</b>.
        I had flagged the currency <i>symbol</i> as a cleaning task, but missed <i>why</i> the extra
        character was there.<br><br>
        The page is UTF-8; the response had no charset header, so it was decoded as Latin-1.
        The bytes <span style="font-family:monospace;font-size:13px">b'\\xc2\\xa3'</span> are &pound; in UTF-8
        and <b style="font-family:monospace">&Acirc;&pound;</b> in Latin-1.<br><br>
        One line fixes it &mdash; <span style="font-family:monospace;font-size:13px">response.encoding = 'utf-8'</span>
        &mdash; and the price column then casts to float cleanly.</p>
    </div>
  </div>`},

/* ---------- 8. DAY24 EDA ---------- */
{ id:"eda", html:`
  <div class="kicker">Project 04 &middot; Exploratory analysis</div>
  <h2>From a question worth asking to a decision worth making</h2>
  <p class="sub">Restaurant transaction records. I wrote the questions before touching a chart, and
  each one was chosen for the operational decision it feeds &mdash; staffing, promotion timing, service-charge policy.</p>
  <div class="grid g2" style="margin-top:20px">
    <div class="card">
      <div class="ct">Tip rate falls as the table gets bigger</div>
      <div class="cs">Mean tip as % of bill, by party size &mdash; greyed bars fail the n&nbsp;&ge;&nbsp;30 threshold</div>
      ${CHARTS.c_tips}
      <p style="font-size:13.5px;color:var(--ink2);line-height:1.5;margin-top:12px">
        Across the party sizes with enough data, tip rate falls from <b>16.6% to 14.6%</b>.
        Solo diners appear to tip 21.7% &mdash; but that rests on <b>four records</b>, so I do not
        quote it. Nominal tips rise with the bill; the <i>rate</i> does not.</p>
    </div>
    <div class="card">
      <div class="ct">What the numbers support</div>
      <ul>
        <li><b>Weekends carry 70.5%</b> of billed revenue. Saturday is busiest (87 covers),
            Sunday has the highest average bill ($21.41). Staff and stock to the weekend dinner peak.</li>
        <li><b>Dinner outsells lunch on both counts</b> &mdash; $20.80 vs $17.17 average, 176 vs 68 covers.
            Lunch is the daypart with headroom, not the one to protect.</li>
        <li class="x"><b>Bill and tip correlate at r = 0.68</b>, but the scatter fans out at high bills:
            some $40+ tables tip very little. The correlation alone hides that risk &mdash; which is why

        <div style="font-size:13.5px;color:var(--ink2);line-height:1.5">

          scatter with a fitted line for relationship. I rejected a pie chart here &mdash; the
          differences between days are too small for angle comparison to resolve.</div>
      </div>
    </div>
  </div>`},

/* ---------- 9. HOW I WORK ---------- */
{ id:"how", html:`
  <div class="kicker">How I work</div>
  <h2>Four habits, each one visible in the work above</h2>
  <div class="grid g2" style="margin-top:22px">
    <div class="card">
      <div class="ct">1 &middot; The question comes before the chart</div>
      <p style="font-size:14px;color:var(--ink2);line-height:1.55">Without a question first, exploratory analysis
      becomes a pile of plots with no direction. With one, the chart type follows automatically and every
      output connects to a decision someone has to make.</p>
      <div style="height:18px"></div>
      <div class="ct">2 &middot; A difference is not a finding until it is tested</div>
      <p style="font-size:14px;color:var(--ink2);line-height:1.55">Group means always differ by <i>something</i>.
      The question is whether the gap survives a significance test and a sample-size check &mdash;
      and whether I went looking for the biggest group before testing it.</p>
    </div>
    <div class="card">
      <div class="ct">3 &middot; I say when I was wrong</div>
      <div class="quote" style="margin-top:8px">
        &ldquo;My initial assumption was not right &mdash; it only looked that way because I was
        reading a handful of rows instead of the whole dataset.&rdquo;
        <cite>&mdash; written into my own notebook, mid-analysis</cite></div>
      <div style="height:16px"></div>
      <div class="ct">4 &middot; I label what is real data and what is not</div>
      <p style="font-size:14px;color:var(--ink2);line-height:1.55">When I derived a hire-date column from
      years of experience, I wrote down that any &ldquo;hiring trend&rdquo; it produced was an artefact of the
      column I built, not a discovery. A constructed feature should never be quoted back as evidence.</p>
    </div>
  </div>
  <div class="card tint" style="margin-top:18px;padding:16px 22px">
    <div style="font-size:14.5px;color:var(--ink2);line-height:1.5">
      <b>Where this comes from:</b> five years of public complaint casework, and a law degree before
      that. Both teach the same thing &mdash; a conclusion has consequences for a real person, and
      &ldquo;the record says so&rdquo; is not the same as &ldquo;the record is right&rdquo;.</div>
  </div>`},

    Every figure in this deck was recomputed from the source data before it was published here.</div>`}
];

/* Which projects appear, and in what order. Drop an id to hide it without losing it. */
const deckOrder = ["cover","skills","impact","dash-build","dash-findings","cleaning",
                   "honesty","collection","eda","how","contact"];

/* ============================================================
   RENDER + NAVIGATION — no need to edit below this line
   ============================================================ */
const stage = document.getElementById("stage");
const deck  = deckOrder.map(id => projects.find(p => p.id === id)).filter(Boolean);

deck.forEach((p, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (p.cls || "");
  el.innerHTML = p.html + (p.foot === false ? "" :
    `<div class="foot"><span>${ME.name} &nbsp;&middot;&nbsp; ${ME.role}</span>
     <span>${String(i + 1).padStart(2, "0")} / ${String(deck.length).padStart(2, "0")}</span></div>`);
  stage.appendChild(el);
});

let cur = 0;
const pg = document.getElementById("pg");
function show(i) {
  cur = Math.max(0, Math.min(deck.length - 1, i));
  [...stage.children].forEach((s, j) => s.classList.toggle("on", j === cur));
  pg.textContent = `${cur + 1} / ${deck.length}`;
}
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("prev").onclick = () => show(cur - 1);
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key))          { e.preventDefault(); show(cur - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End")  show(deck.length - 1);
});
show(0);

</script></body></html>
