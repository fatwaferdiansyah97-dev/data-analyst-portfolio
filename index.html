<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fatwa Ferdiansyah, Data Analyst & Business Intelligence portfolio. Operational analytics, dashboards, data quality, and decision support.">
<meta property="og:type" content="website">
<meta property="og:title" content="Fatwa Ferdiansyah | Data Analyst Portfolio">
<meta property="og:description" content="Case studies on 1.3M procurement contracts, 45,493 deliveries and 2.26M loans. Python, SQL, Power BI, Tableau.">
<meta property="og:url" content="https://fatwaferdiansyah97-dev.github.io/data-analyst-portfolio/">
<meta property="og:image" content="https://fatwaferdiansyah97-dev.github.io/data-analyst-portfolio/thumbnail.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1254">

<title>Fatwa Ferdiansyah | Data Analyst Portfolio</title>
<style>
:root{
  --surface:#fcfcfb;
  --card:#ffffff;
  --ink:#0b0b0b;
  --ink2:#52514e;
  --muted:#8a8985;
  --line:#e6e5e1;
  --blue:#2a78d6;
  --orange:#eb6834;
  --aqua:#1baf7a;
  --blue-soft:#eaf2fd;
  --orange-soft:#fdefe9;
  --aqua-soft:#e8f7f1;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:12px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:#33322f}
body{background:#33322f;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{appearance:none}
a{color:inherit}

#stage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  overflow:hidden;
}

.slide{
  width:1280px;
  height:720px;
  flex:0 0 auto;
  background:var(--surface);
  position:relative;
  display:none;
  padding:48px 64px 94px;
  flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
  border-radius:6px;
  overflow:hidden;
  transform:scale(var(--s, 1));
  transform-origin:center center;
}
.slide.on{display:flex}

/* ---------- Typography ---------- */
.kicker{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue);font-weight:800;margin-bottom:10px;
}
h1{
  font-size:52px;
  line-height:1.04;letter-spacing:-.025em;font-weight:850;
}
h2{
  font-size:30px;
  line-height:1.12;letter-spacing:-.02em;font-weight:800;
  max-width:35ch;
}
h3{font-size:17px;line-height:1.25;font-weight:800}
.sub{
  font-size:15.5px;color:var(--ink2);line-height:1.5;
  margin-top:11px;max-width:78ch;
}
.rule{height:4px;width:64px;background:var(--blue);border-radius:2px;margin:18px 0 20px}

/* ---------- Layout ---------- */
.grid{display:grid;gap:16px;margin-top:18px;min-height:0}
.g2{grid-template-columns:1fr 1fr}
.g25{grid-template-columns:1.1fr .9fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.flex1{flex:1;min-height:0}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;flex-direction:column;min-width:0;
}
.card.tint{background:var(--blue-soft);border-color:#cfe1f9}
.card.warn{background:var(--orange-soft);border-color:#f8d7c7}
.card.good{background:var(--aqua-soft);border-color:#c7ecdd}

.stat{font-size:38px;font-weight:850;letter-spacing:-.025em;line-height:1}
.stat.sm{font-size:27px}
.stat-l{
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:9px;
}
.stat-n{font-size:13.2px;color:var(--ink2);margin-top:9px;line-height:1.42}
.ct{font-size:15px;font-weight:800;margin-bottom:4px}
.cs{font-size:12.2px;color:var(--muted);margin-bottom:10px;line-height:1.4}

/* ---------- Lists / tables ---------- */
ul{list-style:none}
li{
  font-size:13.5px;color:var(--ink2);line-height:1.46;
  padding-left:17px;position:relative;margin-bottom:7px;
}
li::before{
  content:"";position:absolute;left:0;top:.57em;width:6px;height:6px;
  border-radius:50%;background:var(--blue);
}
li.x::before{background:var(--orange)}
li b,.sub b,p b{color:var(--ink);font-weight:750}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;font-size:10.7px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 8px 0;border-bottom:1px solid var(--line);font-weight:800;
}
td{padding:7px 10px 7px 0;border-bottom:1px solid #f1f0ec;color:var(--ink2);vertical-align:top}
td.k{color:var(--ink);font-weight:700}

.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:5px;white-space:nowrap}
.badge.no{background:#fde8e8;color:#a32c2b}
.badge.yes{background:var(--aqua-soft);color:#0f6b4c}

.quote{border-left:4px solid var(--blue);padding:4px 0 4px 16px;font-size:15px;line-height:1.48;color:var(--ink);font-style:italic}
.quote cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.02em}

.tag{
  display:inline-block;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;
  background:#eeedea;color:var(--ink2);margin:0 5px 5px 0;
}
.tag.b{background:var(--blue-soft);color:#1c5cab}
.tag.o{background:var(--orange-soft);color:#a8431f}
.tag.g{background:var(--aqua-soft);color:#0f6b4c}

.callout{
  margin-top:auto;padding:14px 16px;border-radius:10px;background:var(--blue-soft);
  border:1px solid #cfe1f9;font-size:13.5px;color:var(--ink2);line-height:1.48;
}
.eyebrow{
  display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:8px;
}

/* ---------- Cover ---------- */
.cover{justify-content:center}
.cover h1{max-width:760px}
.cover .role{font-size:22px;font-weight:700;color:var(--ink2);letter-spacing:-.01em}
.cover .value{
  max-width:760px;margin-top:18px;font-size:20px;line-height:1.4;color:var(--ink2);
}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}
.chip{
  font-size:12.8px;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:8px 13px;
}
.chip b{color:var(--ink)}
.cover-contact{margin-top:28px;font-size:13px;color:var(--muted)}
.cover-contact a{text-decoration:none}
.cover-contact a:hover{text-decoration:underline;color:var(--blue)}

/* ---------- Project labels ---------- */
.project-badge{
  display:inline-flex;align-items:center;gap:7px;width:max-content;
  padding:6px 10px;border-radius:999px;background:#f1f0ed;color:var(--ink2);
  font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:12px;
}
.project-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.project-badge.portfolio::before{background:var(--orange)}

.mini-stat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}

.skills-grid{grid-template-rows:1fr 1fr}
.skills-grid .card{padding:14px 16px}
.skills-grid h3{font-size:16px}
.skills-grid .callout{font-size:12.5px;padding:11px 13px}
.impact-cases .card{padding:14px 16px}
.impact-cases li{font-size:12.9px;line-height:1.37;margin-bottom:6px}
.impact-cases .eyebrow{margin-bottom:6px}
.impact-cases h3{font-size:16px}

/* ---------- Slide-specific fit fixes ---------- */
.slide[data-slide-id="skills"] .skills-grid{
  grid-template-rows:repeat(2,minmax(0,1fr));
  align-content:stretch;
  min-height:0;
  gap:13px;
}
.slide[data-slide-id="skills"] .skills-grid .card{
  min-height:0;
  padding:12px 14px;
  overflow:hidden;
}
.slide[data-slide-id="skills"] .skills-grid .eyebrow{margin-bottom:5px}
.slide[data-slide-id="skills"] .skills-grid h3{font-size:15px;line-height:1.18}
.slide[data-slide-id="skills"] .skills-grid .tag{font-size:10.5px;padding:4px 8px;margin-right:4px;margin-bottom:4px}
.slide[data-slide-id="skills"] .skills-grid .callout{padding:9px 11px;font-size:11.7px;line-height:1.35}
.slide[data-slide-id="olist-overview"] h2{max-width:30ch}
.slide[data-slide-id="olist-overview"] .olist-stats .card{padding:12px 14px}
.slide[data-slide-id="olist-overview"] .olist-stats .stat{font-size:34px}
.slide[data-slide-id="olist-overview"] .olist-stats .stat-n{font-size:11.8px;line-height:1.28;margin-top:7px}
.slide[data-slide-id="olist-overview"] .olist-body .card{padding:13px 15px;overflow:hidden}
.slide[data-slide-id="olist-overview"] .olist-body h3{font-size:15.5px}
.slide[data-slide-id="olist-overview"] .olist-body li{font-size:12.5px;line-height:1.34;margin-bottom:5px}
.slide[data-slide-id="olist-overview"] .olist-body .eyebrow{margin-bottom:5px}
.slide[data-slide-id="olist-overview"] .olist-body .callout{padding:9px 11px;font-size:11.8px;line-height:1.34}


/* ---------- HR slide fit ---------- */
.slide[data-slide-id="hr"] .g25 > div:last-child{gap:10px !important}
.slide[data-slide-id="hr"] .g25 .card{padding:12px 14px !important;overflow:hidden;min-height:0}
.slide[data-slide-id="hr"] .g25 p{font-size:12.9px !important;line-height:1.4 !important}
.slide[data-slide-id="hr"] .g25 table td{padding:5px 9px 5px 0}
.slide[data-slide-id="hr"] .g25 .eyebrow{margin-bottom:4px}

/* ---------- Impact slide fit ---------- */
.slide[data-slide-id="impact"] .impact-cases .card{padding:13px 15px;overflow:hidden;min-height:0}
.slide[data-slide-id="impact"] .impact-cases li{font-size:12.4px;line-height:1.33;margin-bottom:5px}
.slide[data-slide-id="impact"] .impact-cases h3{font-size:15.2px;line-height:1.2}
.slide[data-slide-id="impact"] .impact-cases .callout{padding:10px 12px;font-size:12.2px;line-height:1.36}

/* ---------- Explore buttons (contact slide) ---------- */
.explore-label{
  margin-top:26px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:800;
}
a.chip.go{
  display:inline-block;text-decoration:none;
  background:var(--blue-soft);border-color:#cfe1f9;color:#1c5cab;
  padding:9px 14px;
}
a.chip.go b{color:#1c5cab}
a.chip.go:hover{background:var(--blue);border-color:var(--blue);color:#fff}
a.chip.go:hover b{color:#fff}

/* ---------- Evidence links ---------- */
.evidence-links{margin-top:9px;font-size:12.4px;color:var(--muted)}
.evidence-links a{color:var(--blue);font-weight:700;text-decoration:none}
.evidence-links a:hover{text-decoration:underline}

/* ---------- SQL slides fit ---------- */
.slide[data-slide-id="sql-database"] .sql-stats .card{padding:12px 14px}
.slide[data-slide-id="sql-database"] .sql-stats .stat{font-size:30px}
.slide[data-slide-id="sql-database"] .sql-stats .stat.sm{font-size:21px}
.slide[data-slide-id="sql-database"] .sql-stats .stat-n{font-size:11.5px;line-height:1.28;margin-top:7px}
.slide[data-slide-id="sql-database"] .sql-body .card{padding:13px 15px;overflow:hidden;min-height:0}
.slide[data-slide-id="sql-implementation"] .sql-impl .card{padding:14px 16px;overflow:hidden;min-height:0}
.slide[data-slide-id="sql-implementation"] .sql-impl li{font-size:12.8px;line-height:1.38;margin-bottom:6px}

/* ---------- Lending Club slides fit ---------- */
.slide[data-slide-id="lc-overview"] h2{max-width:42ch;font-size:27px}
.slide[data-slide-id="lc-overview"] .lc-stats .card{padding:12px 14px}
.slide[data-slide-id="lc-overview"] .lc-stats .stat.sm{font-size:25px}
.slide[data-slide-id="lc-overview"] .lc-stats .stat-n{font-size:11.6px;line-height:1.28;margin-top:7px}
.slide[data-slide-id="lc-overview"] .lc-body .card{padding:13px 15px;overflow:hidden;min-height:0}
.slide[data-slide-id="lc-overview"] .lc-body h3{font-size:15.5px}
.slide[data-slide-id="lc-overview"] .lc-body li{font-size:12.6px;line-height:1.36;margin-bottom:5px}
.slide[data-slide-id="lc-verification"] h2{max-width:44ch;font-size:27px}
.slide[data-slide-id="lc-verification"] .lc-verify > .card{min-height:0;overflow:hidden}
.slide[data-slide-id="lc-verification"] .lc-verify li{font-size:12.3px;line-height:1.34;margin-bottom:5px}
.slide[data-slide-id="lc-verification"] .lc-verify .eyebrow{margin-bottom:5px}
.slide[data-slide-id="proc-method"] h2{max-width:46ch;font-size:27px}
.slide[data-slide-id="proc-method"] .sub{font-size:15px}
.slide[data-slide-id="proc-method"] .lc-stats .card{padding:12px 14px}
.slide[data-slide-id="proc-method"] .lc-stats .stat.sm{font-size:25px}
.slide[data-slide-id="proc-method"] .lc-stats .stat-n{font-size:11.6px;line-height:1.28;margin-top:7px}
.slide[data-slide-id="proc-method"] .lc-body .card{padding:13px 15px;overflow:hidden;min-height:0}
.slide[data-slide-id="proc-method"] .lc-body h3{font-size:15.5px}
.slide[data-slide-id="proc-method"] .lc-body li{font-size:12.4px;line-height:1.34;margin-bottom:4px}
.slide[data-slide-id="proc-method"] .lc-body .callout{padding:9px 11px;font-size:12px;line-height:1.34}
.slide[data-slide-id="proc-findings"] h2{max-width:44ch;font-size:27px}
.slide[data-slide-id="proc-findings"] .lc-verify > .card{min-height:0;overflow:hidden}
.slide[data-slide-id="proc-findings"] .lc-verify li{font-size:12.3px;line-height:1.34;margin-bottom:5px}
.slide[data-slide-id="proc-findings"] .lc-verify .eyebrow{margin-bottom:5px}

/* ---------- A/B Testing slides fit ---------- */
.slide[data-slide-id="ab-results"] h2{max-width:44ch;font-size:26px}
.slide[data-slide-id="ab-results"] .ab-body > .card{min-height:0;overflow:hidden}
.slide[data-slide-id="ab-results"] .ab-body li{font-size:12.2px;line-height:1.34;margin-bottom:6px}
.slide[data-slide-id="ab-results"] .ab-body .eyebrow{margin-bottom:5px}
.slide[data-slide-id="ab-monitoring"] h2{max-width:44ch;font-size:26px}
.slide[data-slide-id="ab-monitoring"] .ab-body > .card{min-height:0;overflow:hidden}
.slide[data-slide-id="ab-monitoring"] .ab-body li{font-size:12.4px;line-height:1.38;margin-bottom:7px}
.slide[data-slide-id="ab-monitoring"] .ab-body .eyebrow{margin-bottom:5px}

/* ---------- Customer Segmentation slides fit ---------- */
.slide[data-slide-id="rfm-segments"] h2{max-width:46ch;font-size:26px}
.slide[data-slide-id="rfm-segments"] .rfm-body > .card{min-height:0;overflow:hidden}
.slide[data-slide-id="rfm-segments"] .rfm-body li{font-size:12.2px;line-height:1.34;margin-bottom:6px}
.slide[data-slide-id="rfm-segments"] .rfm-body .eyebrow{margin-bottom:5px}
.slide[data-slide-id="rfm-recommendations"] h2{max-width:48ch;font-size:25px}
.slide[data-slide-id="rfm-recommendations"] table{font-size:11.6px}
.slide[data-slide-id="rfm-recommendations"] th{padding-bottom:6px}
.slide[data-slide-id="rfm-recommendations"] td{padding:6px 8px 6px 0}

/* ---------- Capability slide fit ---------- */
.capability-grid{
  grid-template-rows: minmax(0, 1fr) minmax(0, .82fr);
  align-items:stretch;
}
.capability-grid > .card{
  min-height:0;
  overflow:hidden;
}
.capability-discipline{
  padding-top:14px;
  padding-bottom:12px;
}
.capability-discipline ul{
  margin-top:8px !important;
}
.capability-discipline li{
  font-size:12.6px;
  line-height:1.32;
  margin-bottom:5px;
}


/* ---------- v15: cover with photo + featured work ---------- */
.cover2{justify-content:flex-start;padding:38px 64px 36px}
.cover-top{display:flex;gap:44px;align-items:center;justify-content:space-between}
.cover-top .txt{flex:1;min-width:0}
.cover2 h1{font-size:50px}
.cover2 .rule{margin:14px 0 14px}
.cover2 .value{margin-top:12px;font-size:19px}
.cover2 .chips{margin-top:16px}
.cover2 .cover-contact{margin-top:14px}
.cover-photo{width:200px;height:200px;border-radius:20px;object-fit:cover;object-position:50% 18%;
  box-shadow:0 10px 28px rgba(0,0,0,.14);flex:none;border:4px solid #fff}
.feat-label{margin-top:22px;margin-bottom:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
.feat-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
  text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;min-height:0}
.feat-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.10);border-color:#9fc3ef}
.feat-card img{width:100%;flex:1 1 0;height:0;min-height:140px;object-fit:cover;object-position:top left;border-bottom:1px solid var(--line)}
.feat-b{flex:none !important}
.feat-b{padding:11px 14px 12px;display:flex;flex-direction:column;flex:1}
.feat-b .eyebrow{margin-bottom:4px;color:var(--orange)}
.feat-b h3{font-size:16px;margin-bottom:4px}
.feat-b p{font-size:12.6px;color:var(--ink2);line-height:1.4}
.feat-b .open{margin-top:auto;padding-top:6px;font-size:12px;color:var(--blue);font-weight:800}

/* ---------- v15: dashboard screenshot slides ---------- */
.shots{display:grid;gap:14px;margin-top:14px;flex:1;min-height:0}
.shots.two{grid-template-columns:1fr 1fr}
.shots.wide-left{grid-template-columns:1.35fr 1fr}
.shots .col{display:grid;gap:14px;grid-template-rows:1fr 1fr;min-height:0}
.shot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.shot img{width:100%;flex:1 1 auto;min-height:0;object-fit:contain;object-position:center top;border-radius:6px}
.shot .cap{font-size:12.2px;color:var(--ink2);line-height:1.38;margin-top:8px;flex:none}
.shot .cap b{color:var(--ink)}
.side-note{display:flex;flex-direction:column;gap:12px;min-height:0}

/* ---------- v15: more work + appendix jump ---------- */
[data-go]{cursor:pointer}
.more-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.more-card{text-decoration:none;color:inherit;transition:border-color .15s ease,box-shadow .15s ease}
.more-card:hover{border-color:#9fc3ef;box-shadow:0 8px 20px rgba(0,0,0,.07)}
.more-card p{font-size:13px;color:var(--ink2);line-height:1.42;margin-top:6px}
.more-card .open{margin-top:auto;padding-top:8px;font-size:12px;color:var(--blue);font-weight:800}

@media (max-width:900px){
  .cover2{padding:30px 24px 80px}
  .cover-top{flex-direction:column-reverse;align-items:flex-start;gap:18px}
  .cover-photo{width:140px;height:140px}
  .feat{grid-template-columns:1fr}
  .feat-card img{height:170px;flex:none}
  .shots.two,.shots.wide-left{grid-template-columns:1fr}
  .shots .col{grid-template-rows:auto}
  .shot img{flex:none;height:auto}
  .more-grid{grid-template-columns:1fr;grid-template-rows:none}
}

/* ---------- Navigation ---------- */
#nav{
  position:fixed;right:20px;bottom:18px;display:flex;gap:8px;align-items:center;z-index:9;
}
#nav button{
  background:#fff;border:1px solid #55534f;color:var(--ink);width:36px;height:36px;
  border-radius:8px;font-size:15px;cursor:pointer;line-height:1;
}
#nav button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
#nav button:focus-visible{outline:3px solid rgba(42,120,214,.35);outline-offset:2px}
#pg{color:#d8d6d0;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}

.foot{
  position:absolute;left:64px;right:64px;bottom:20px;display:flex;justify-content:space-between;
  font-size:10.8px;color:var(--muted);letter-spacing:.04em;border-top:1px solid var(--line);padding-top:10px;
}
svg{display:block}

/* ---------- Future project architecture ---------- */
.future-slot{display:none}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  body{background:var(--surface)}
  #stage{padding:0;align-items:flex-start;overflow:visible}
  .slide{
    width:100vw;max-height:none;min-height:100vh;height:auto;
    border-radius:0;box-shadow:none;padding:34px 24px 74px;overflow:visible;
    transform:none;
  }

  {
    id:"hr", title:"Analytical Rigor",
    html:`
      <div class="project-badge portfolio">Portfolio Project · HR Analytics</div>
      <h2>The finding looked real. Testing showed it wasn't.</h2>
      <p class="sub">A good analyst is not only able to find a pattern. They should also be able to stop themselves from reporting a pattern that does not survive proper testing.</p>

      <div class="grid g25" style="margin-top:18px;flex:1">
        <div class="card">
          <span class="eyebrow">Initial observation</span>
          <h3>HR had the highest high-performer rate: 37.6%</h3>
          <div style="margin-top:10px">${CHARTS.ci}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;min-height:0">
          <div class="card warn" style="padding:15px 17px">
            <span class="eyebrow" style="color:#a8431f">What I first concluded</span>
            <p style="font-size:13.6px;color:var(--ink2);line-height:1.46;margin-top:3px">
              “HR has the highest share of high performers despite the lowest average pay, so pay is not what drives performance.”
            </p>
          </div>
          <div class="card" style="padding:15px 17px">
            <span class="eyebrow">Then I tested it</span>
            <table style="margin-top:2px">
              <tr><td class="k">HR vs the rest</td><td>p = 0.016</td><td><span class="badge yes">looks real</span></td></tr>
              <tr><td class="k">Six departments</td><td>Bonferroni correction</td><td></td></tr>
              <tr><td class="k">HR corrected</td><td>p = 0.094</td><td><span class="badge no">not significant</span></td></tr>
              <tr><td class="k">χ² omnibus</td><td>p = 0.234</td><td><span class="badge no">not significant</span></td></tr>
            </table>
          </div>
          <div class="card tint" style="padding:15px 17px;margin-top:auto">
            <span class="eyebrow" style="color:#1c5cab">What I reported instead</span>
            <p style="font-size:13.6px;color:var(--ink2);line-height:1.46;margin-top:3px">
              I had selected the highest group first and tested it second. With six groups, that creates a false-positive risk. <b>No department difference was reported and no HR recommendation was made.</b>
            </p>
          </div>
        </div>
      </div>`
  },

    id:"sql-database", title:"SQL & Database Design",
    html:`
      <div class="project-badge portfolio">Portfolio Project · SQL &amp; Relational Database Design</div>
      <h2>Built an e-commerce database from scratch in PostgreSQL</h2>
      <p class="sub">A database-design case covering master data, transaction tables, referential integrity, many-to-many relationships, CRUD operations, and schema modification.</p>

      <div class="grid g4 sql-stats" style="margin-top:18px;flex:none">
        <div class="card"><div class="stat-l">Tables</div><div class="stat">5</div><div class="stat-n">categories · customers · products · orders · order_details</div></div>
        <div class="card"><div class="stat-l">Relationship types</div><div class="stat">2</div><div class="stat-n">one-to-many + many-to-many</div></div>
        <div class="card"><div class="stat-l">Integrity rules</div><div class="stat">7+</div><div class="stat-n">PK · FK · NOT NULL · UNIQUE · CHECK · DEFAULT</div></div>
        <div class="card"><div class="stat-l">Database</div><div class="stat sm">PostgreSQL</div><div class="stat-n">implemented and tested in DBeaver</div></div>
      </div>

      <div class="grid g25 sql-body" style="margin-top:16px;flex:1;min-height:0">
        <div class="card">
          <span class="eyebrow">Relational model</span>
          <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.2px;line-height:1.55;color:var(--ink2);margin-top:3px">
            <div><b>CATEGORIES</b> &rarr; PRODUCTS</div>
            <div style="padding-left:22px">category_id · product_id · price</div>
            <div style="margin-top:5px"><b>CUSTOMERS</b> &rarr; ORDERS</div>
            <div style="padding-left:22px">customer_id · order_id</div>
            <div style="margin-top:5px"><b>ORDERS</b> &rarr; ORDER_DETAILS &larr; PRODUCTS</div>
            <div style="padding-left:22px">composite PK: (order_id, product_id)</div>
          </div>
          <div class="callout"><b>Why the bridge table?</b> One order can contain multiple products, while one product can appear in many orders.</div>
        </div>

        <div class="card good">
          <span class="eyebrow">Design decision</span>
          <h3>Current price is not the historical transaction price</h3>
          <p style="font-size:13.4px;color:var(--ink2);line-height:1.48;margin-top:9px">
            <b>products.price</b> holds the current catalogue price. <b>order_details.unit_price</b> holds the price captured when the order was placed, so a later price update does not rewrite transaction history.
          </p>
          <div class="callout" style="background:#fff;border-color:#c7ecdd"><b>Evidence:</b> the script updates the catalogue price while the original order-detail unit price stays unchanged.</div>
        </div>
      </div>`

  {
    id:"proc-method", title:"Procurement Risk Case Study",
    html:`
      <div class="project-badge portfolio">Final Project · Procurement Risk Prioritization</div>
      <h2>Raw risk scores punish buyers for what they buy. I compared each buyer only against its own market.</h2>
      <p class="sub">1.3 million Indonesian government contracts from LPSE, 2013 to 2023. The question: which public buyers score higher than they should, once the type of spending and the year are taken into account?</p>
      <div class="evidence-links"><a href="https://github.com/fatwaferdiansyah97-dev/procurement-risk-analysis-indonesia" target="_blank" rel="noopener">Notebook, reduction script and README on GitHub</a></div>

      <div class="grid g4 lc-stats" style="margin-top:18px;flex:none">
        <div class="card"><div class="stat-l">Raw file</div><div class="stat sm">10.79 GB</div><div class="stat-n">187 columns, 5,453,095 rows</div></div>
        <div class="card"><div class="stat-l">Clean contracts</div><div class="stat sm">1,301,381</div><div class="stat-n">after 67,521 duplicate rows removed</div></div>
        <div class="card"><div class="stat-l">Comparable</div><div class="stat sm">957,460</div><div class="stat-n">with a valid market group</div></div>
        <div class="card"><div class="stat-l">Buyers assessed</div><div class="stat sm">518</div><div class="stat-n">in both periods</div></div>
      </div>

      <div class="grid g2 lc-body" style="margin-top:16px;flex:1;min-height:0">
        <div class="card good">
          <span class="eyebrow">Data issues fixed before scoring</span>
          <h3>Five problems found during exploration</h3>
          <ul style="margin-top:11px">
            <li>The bidder-count column held <b>registrants</b>, not bids (median 21). Single-bid share was rebuilt from actual bid rows: 39%, not 0.36%.</li>
            <li>The official single-bid indicator used the same column, so it was replaced.</li>
            <li>Direct awards fell from 57% to 0.3% in 2019: a recording change, so the analysis was split into two periods.</li>
            <li>Product codes lost leading zeros; fixing them moved <b>123,403</b> codes to the right market.</li>
            <li>7,691 contracts with implausible price ratios were <b>flagged, not deleted</b>.</li>
          </ul>
        </div>
        <div class="card">
          <span class="eyebrow">Method</span>
          <h3>Indirect standardization (Observed / Expected)</h3>
          <ul style="margin-top:11px">
            <li>Risk score: three equal-weight signals (single bid, short advertising, unusual decision period).</li>
            <li>Contracts split into cells of year &times; market division.</li>
            <li>Each buyer's expected score uses <b>other buyers'</b> average in the same cells, so no buyer judges itself.</li>
            <li>O/E above 1 means riskier than its market norm; 95% CIs clustered by tender.</li>
          </ul>
          <div class="callout"><b>Why it matters:</b> a district that mostly builds roads always looks riskier than a ministry buying consultancy. O/E removes that before ranking.</div>
        </div>
      </div>`
  },

  {
    id:"proc-findings", title:"Procurement Risk Findings",
    html:`
      <div class="project-badge portfolio">Final Project · Procurement Risk Findings</div>
      <h2>170 of 518 buyers stayed above their market norm in two separate periods.</h2>
      <p class="sub">The two periods use completely different contracts. Swapping the comparison cells still gives 162 to 173 buyers, and adding month to the cells keeps the O/E correlation at 0.987.</p>

      <div class="grid g25 lc-verify" style="margin-top:16px;flex:1;min-height:0">
        <div class="card">
          <span class="eyebrow">Priority buyers versus the rest</span>
          <div style="margin-top:8px">${CHARTS.procGap}</div>
          <div class="grid g3" style="margin-top:12px;gap:10px">
            <div class="card tint" style="padding:10px 12px"><div class="stat-l">Year-end pressure</div><div class="stat sm" style="font-size:22px">33.8 &rarr; 53.2</div><div class="stat-n">avg risk, January to October</div></div>
            <div class="card tint" style="padding:10px 12px"><div class="stat-l">Seasonal peak</div><div class="stat sm" style="font-size:22px">11 of 11</div><div class="stat-n">years peak in Oct or Nov</div></div>
            <div class="card tint" style="padding:10px 12px"><div class="stat-l">Robustness</div><div class="stat sm" style="font-size:22px">162 to 173</div><div class="stat-n">buyers under other comparison cells</div></div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
          <div class="card" style="padding:14px 16px">
            <span class="eyebrow">Recommended actions</span>
            <ul style="margin-top:8px">
              <li>Examine the 170 buyers first, starting with districts and construction (risk 56.0 vs 38.5 nationally).</li>
              <li>Review owner's-estimate files for the 561 supplier pairs priced at 99%+ of estimate.</li>
              <li>Prioritise 28 buyers that worsened (O/E 0.82 to 1.17).</li>
              <li>Add oversight to tenders announced September to November: risk peaks there in 11 of 11 years.</li>
            </ul>
          </div>
          <div class="card tint" style="padding:14px 16px;margin-top:auto">
            <span class="eyebrow" style="color:#1c5cab">What this is not</span>
            <ul style="margin-top:8px">
              <li>A list of wrongdoing. It is an order of examination, <b>not an audit result</b>.</li>
              <li>A measure of state loss. The price gap is relative to market norms.</li>
              <li>O/E measures deviation from the norm, not from the truth: if a whole market behaves badly, no one stands out.</li>
            </ul>
          </div>
        </div>
      </div>`
  },

  {
    id:"lc-overview", title:"Credit Risk Case Study",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Credit Risk & Control Effectiveness</div>
      <h2>Before comparing default rates, I had to decide which loans were allowed to count.</h2>
      <p class="sub">Lending Club, 2007 to 2018. A loan still inside its term has not had the chance to default yet. Counting it as "did not default" would make every recent vintage look artificially safe.</p>
      <div class="evidence-links"><a href="https://github.com/fatwaferdiansyah97-dev/lending-club-credit-risk-analysis" target="_blank" rel="noopener">SQL views, scripts and README on GitHub</a> &nbsp;·&nbsp; <a href="https://public.tableau.com/shared/KF5Y2HRP4?:display_count=n&amp;:origin=viz_share_link" target="_blank" rel="noopener">Interactive dashboard on Tableau Public</a></div>

      <div class="grid g4 lc-stats" style="margin-top:18px;flex:none">
        <div class="card"><div class="stat-l">Raw dataset</div><div class="stat sm">2,260,668</div><div class="stat-n">Lending Club loans, Jun 2007 to Dec 2018</div></div>
        <div class="card"><div class="stat-l">Matured &amp; analysed</div><div class="stat sm">731,403</div><div class="stat-n">36 and 60 month terms completed</div></div>
        <div class="card"><div class="stat-l">Still within term</div><div class="stat sm">1,404,642</div><div class="stat-n">excluded from rate comparisons</div></div>
        <div class="card"><div class="stat-l">Default rate</div><div class="stat sm">15.03%</div><div class="stat-n">109,910 defaults on the matured book</div></div>
      </div>

      <div class="grid g2 lc-body" style="margin-top:16px;flex:1;min-height:0">
        <div class="card good">
          <span class="eyebrow">Method</span>
          <h3>Right-censoring handled as a separate view, not a footnote</h3>
          <ul style="margin-top:11px">
            <li>Built two SQL views: one for cohorts whose term has finished, one for loans still running.</li>
            <li>Proof the split matters: the <b>Dec 2018</b> 60-month cohort shows <b>0.00%</b> default across 10,491 loans, purely because no time has passed.</li>
            <li>Every headline rate in this project is computed on matured cohorts only.</li>
          </ul>
          <div class="callout" style="background:#fff;border-color:#c7ecdd"><b>Why it matters:</b> blending both sets into one number reports <b>12.02%</b> instead of <b>15.03%</b>, understating default by <b>3.01 pp</b>, a fifth of the true rate.</div>
        </div>
        <div class="card">
          <span class="eyebrow">Baseline risk</span>
          <h3>Two structural factors established before testing any control</h3>
          <ul style="margin-top:11px">
            <li><b>Term:</b> 60-month loans default at <b>25.40%</b> against <b>14.04%</b> for 36-month loans.</li>
            <li><b>Vintage:</b> 36-month default peaked at <b>26.20%</b> for 2007 originations, fell to <b>10.63%</b> for 2011, then rose to <b>15.47%</b> by 2016.</li>
            <li>Both move default rates on their own, so neither could be left uncontrolled in the next step.</li>
          </ul>
          <div class="callout"><b>Reading:</b> the 2011 trough is a post-crisis tightening effect, not a permanent improvement. Any claim about a credit control has to be tested inside these strata, not across them.</div>
        </div>
      </div>`
  },

  {
    id:"lc-verification", title:"Control Effectiveness",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Control Effectiveness</div>
      <h2>Verified borrowers defaulted more. I tested whether risk grade explains it.</h2>
      <p class="sub">Income verification is meant to reduce default. On the matured book it is associated with the opposite. The useful question is not whether that is surprising, but how much of it survives controlling for the grade already assigned at origination.</p>

      <div class="grid g25 lc-verify" style="margin-top:16px;flex:1;min-height:0">
        <div class="card">
          <span class="eyebrow">Default rate by grade</span>
          <h3>The gap holds in all seven grades</h3>
          <div style="margin-top:8px">${CHARTS.lcGrade}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
          <div class="card" style="padding:14px 16px">
            <span class="eyebrow">Decomposition</span>
            <div style="margin-top:2px">${CHARTS.lcDecomp}</div>
          </div>
          <div class="card tint" style="padding:14px 16px;margin-top:auto">
            <span class="eyebrow" style="color:#1c5cab">What I concluded</span>
            <ul style="margin-top:8px">
              <li>Most of the headline gap is composition: grades D to G are <b>28.4%</b> of the verified book but only <b>12.4%</b> of the unverified book.</li>
              <li>Standardising every status to one common grade mix narrows the gap from <b>6.29 pp</b> to <b>2.34 pp</b>, but does not close it.</li>
              <li>Stratified across grades: common odds ratio <b>1.21</b>, &chi;&sup2; = 485.0, p &lt; 0.001.</li>
              <li>Reading: verification behaves like a reactive step applied to applications that already look risky, not a preventive control. This is an association in observational data, <b>not evidence of causation</b>.</li>
            </ul>
          </div>
        </div>
      </div>`
  },

  {
    id:"ab-results", title:"A/B Testing, Spotify Campaign",
    html:`
      <div class="project-badge portfolio">Portfolio Project · A/B Testing, Spotify Campaign</div>
      <h2>All four metrics moved together, and the lift wasn't a sample-size illusion.</h2>
      <p class="sub">100,000 users, 50,000 per arm. Welch's t-test and Mann-Whitney U for the continuous metrics, a two-proportion Z-test for the binary ones, all four significant at p &lt; 0.001.</p>

      <div class="grid g25 ab-body" style="margin-top:16px;flex:1;min-height:0">
        <div class="card">
          <span class="eyebrow">Relative lift, Target vs Control</span>
          <div style="margin-top:8px">${CHARTS.liftChart}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
          <div class="card" style="padding:14px 16px">
            <span class="eyebrow">Why the p-values alone don't prove much</span>
            <ul style="margin-top:8px">
              <li>The actual sample, 50,000 per arm, is 175x the 286 per arm a power analysis says was needed to detect the Payment effect at 80% power. At that scale almost anything clears p &lt; 0.05.</li>
              <li>Effect size carries the argument instead. Engagement and Duration Played both land in Cohen's "large" band (d = 2.00 and 1.33); Payment and Subscription are smaller but still real (Cohen's h = 0.23 and 0.45).</li>
              <li>Running four tests at once inflates the false-positive risk to 18.6%. Under a stricter Bonferroni threshold (alpha 0.0125), all four still hold.</li>
            </ul>
          </div>
          <div class="card tint" style="padding:14px 16px;margin-top:auto">
            <span class="eyebrow" style="color:#1c5cab">Guardrail, proven not assumed</span>
            <ul style="margin-top:8px">
              <li>Subscription is the primary metric. Engagement is the guardrail, chosen because a forced-upsell pattern would show Subscription rising while Engagement falls.</li>
              <li>The guardrail check is computed from Engagement's own test result, not a manual guess, still up 33.3% at p &lt; 0.001, which is what makes the Ship It call defensible.</li>
            </ul>
          </div>
        </div>
      </div>`
  },

  {
    id:"ab-monitoring", title:"Post-Rollout Monitoring",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Post-Rollout Monitoring</div>
      <h2>Daily active users kept climbing for two weeks after rollout, with no dip to explain away.</h2>
      <p class="sub">15 days of Total Users after the campaign went live. No pre-rollout baseline was provided in the data.</p>

      <div class="grid g25 ab-body" style="margin-top:14px;flex:1;min-height:0">
        <div class="card">
          <span class="eyebrow">Daily active users, days 1 to 15 post-rollout</span>
          <div style="margin-top:6px">${CHARTS.monitorChart}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:11px;min-height:0">
          <div class="card" style="padding:13px 15px">
            <span class="eyebrow">Reading the trend</span>
            <ul style="margin-top:7px">
              <li>Week 1 averaged 16,184 users/day, Week 2 averaged 24,670, a jump confirmed by a Welch t-test (p = 0.0001).</li>
              <li>The 15-day linear trend adds about 871 users/day on average (p = 0.0009, r = 0.76), a consistent direction, not one lucky week.</li>
            </ul>
          </div>
          <div class="card tint" style="padding:13px 15px;margin-top:auto">
            <span class="eyebrow" style="color:#1c5cab">What this monitoring can't tell you</span>
            <ul style="margin-top:7px">
              <li>There is no pre-rollout baseline in this data, so this reads as a trend after rollout, not a controlled before-versus-after comparison.</li>
              <li>Next step: re-check at month 2 and 3 to rule out a novelty effect before treating this growth rate as the new normal.</li>
            </ul>
          </div>
        </div>
      </div>`
  },

  {
    id:"rfm-segments", title:"Customer Segmentation, RFM Analysis",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Customer Segmentation, RFM Analysis</div>
      <h2>At Risk is the largest segment, but Potential customers generate the most profit.</h2>
      <p class="sub">Dibimbing bootcamp case study. Superstore retail dataset, 9,994 orders, 793 unique customers. Recency, Frequency and Monetary scored per customer and segmented in Power BI.</p>

      <div class="grid g25 rfm-body" style="margin-top:16px;flex:1;min-height:0">
        <div class="card">
          <span class="eyebrow">Customer count and profit, by segment</span>
          <div style="margin-top:8px">${CHARTS.rfmChart}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
          <div class="card" style="padding:14px 16px">
            <span class="eyebrow">Reading the segments</span>
            <ul style="margin-top:8px">
              <li>At Risk is the largest group, 278 of 793 customers (35%), but ranks second-lowest in profit (Rp73K) among the five segments.</li>
              <li>Potential, 266 customers (34%), produces the highest total profit (Rp94K) despite trailing At Risk in headcount, so segment size alone does not track segment value.</li>
              <li>Champions and Loyal together are only 20% of customers (158) but still contribute Rp111K combined, more than At Risk alone.</li>
            </ul>
          </div>
          <div class="card tint" style="padding:14px 16px;margin-top:auto">
            <span class="eyebrow" style="color:#1c5cab">How the segments were built</span>
            <ul style="margin-top:8px">
              <li>Recency, Frequency and Monetary were each ranked into quintiles (score 1 to 5) from a snapshot-date customer summary, then combined with fixed threshold rules, e.g. Champions requires R, F and M all scoring 4 or higher.</li>
              <li>Independently verified against the raw transaction data: replicating this rule logic reproduces the dashboard's segment counts and profit totals exactly.</li>
            </ul>
          </div>
        </div>
      </div>`
  },

  {
    id:"olist-overview", title:"Olist Case Study",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Tableau BI & Data Story</div>
      <h2>Revenue grew. Customer retention was the real problem.</h2>
      <p class="sub">Brazilian E-Commerce Public Dataset by Olist. I built an interactive Tableau story to separate marketplace growth from repeat-customer behavior, while preserving the data's relational structure.</p>

      <div class="grid g4 olist-stats" style="margin-top:18px;flex:none">
        <div class="card"><div class="stat-l">Orders</div><div class="stat">97,688</div><div class="stat-n">Jan 2017 to Aug 2018 · grain: 1 order</div></div>
        <div class="card"><div class="stat-l">Customers</div><div class="stat">94,437</div><div class="stat-n">unique customers with orders</div></div>
        <div class="card"><div class="stat-l">Repeat customers</div><div class="stat">3.1%</div><div class="stat-n">2,921 customers placed >1 order</div></div>
        <div class="card"><div class="stat-l">Order revenue</div><div class="stat">R$14.42M</div><div class="stat-n">price + freight, deduplicated at order level</div></div>
      </div>

      <div class="grid g2 olist-body" style="margin-top:18px;flex:1">
        <div class="card">
          <span class="eyebrow">Business question</span>
          <h3>Is marketplace growth coming from loyalty or continuous acquisition?</h3>
          <ul style="margin-top:12px">
            <li>Revenue and order volume trend upward, but only about <b>3.1%</b> of unique customers return for another order.</li>
            <li>That changes the decision: the problem is not simply “how do we grow sales?” but “how do we create more value from customers we already acquired?”</li>
            <li>Customer-level repeat behavior became the anchor metric for the Tableau story.</li>
          </ul>
        </div>
        <div class="card good">
          <span class="eyebrow">What the dashboard enables</span>
          <h3>Move from headline KPI to investigation</h3>
          <ul style="margin-top:12px">
            <li>Compare repeat behavior across product categories.</li>
            <li>Explore monthly patterns with category filters.</li>
            <li>Test whether delivery performance is a plausible retention lever.</li>
            <li>Use Tableau actions and parameters to let a stakeholder ask the next question without rebuilding the dashboard.</li>
          </ul>
          <div class="callout" style="background:#fff;border-color:#c7ecdd"><b>Core decision:</b> prioritize retention analysis before treating overall revenue growth as proof of customer loyalty.</div>
        </div>
      </div>`
  },

  {
    id:"olist-technical", title:"Olist Technical & Recommendations",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Tableau Technical Evidence</div>
      <h2>Data modeling was part of the analysis, not just setup.</h2>
      <div class="grid g2" style="margin-top:20px;flex:1">
        <div class="card">
          <span class="eyebrow">Data preparation & modeling</span>
          <h3>Why I used Relationships instead of a physical join</h3>
          <ul style="margin-top:12px">
            <li><b>750</b> orders had no payment row; preserving them avoided unnecessary row loss.</li>
            <li><b>2,936</b> orders used more than one payment method, so joining payment rows directly could multiply order-level measures.</li>
            <li>I used Tableau Relationships and an order-level LOD calculation to deduplicate price + freight before aggregating revenue.</li>
            <li><b>218</b> orders had seller IDs not found in the seller table; those records were kept visible for investigation rather than silently dropped.</li>
          </ul>
        </div>

        <div class="card">
          <span class="eyebrow">Advanced Tableau</span>
          <h3>Calculated fields, LOD, parameters & actions</h3>
          <ul style="margin-top:12px">
            <li><b>Order Revenue (dedup)</b>: fixed at Order ID level.</li>
            <li><b>Repeat Customer Flag</b>: customer-level COUNTD of orders.</li>
            <li>Delivery time, delay, and late-order fields for retention diagnostics.</li>
            <li><b>Top N parameter + filter action</b> so category exploration updates downstream views without rebuilding worksheets.</li>
          </ul>
          <div class="callout"><b>Recruiter takeaway:</b> this is not only a charting exercise. It shows relational modeling, measure-level data quality protection, interactive BI, and business storytelling in one case.</div>
        </div>

        <div class="card tint" style="grid-column:1/-1">
          <span class="eyebrow">Decision-oriented recommendations</span>
          <div class="grid g3" style="margin-top:10px">
            <div>
              <h3>01 · Retention</h3>
              <p class="stat-n">Focus on repeat-purchase opportunities rather than interpreting overall revenue growth as evidence of loyalty.</p>
            </div>
            <div>
              <h3>02 · Category</h3>
              <p class="stat-n">Use category-level repeat behavior to identify where cross-sell or post-purchase campaigns are most promising.</p>
            </div>
            <div>
              <h3>03 · Delivery</h3>
              <p class="stat-n">Treat delivery reliability as a supporting diagnostic, not automatically the primary retention lever.</p>
            </div>
          </div>
        </div>
      </div>`
  },

  {
    id:"pipeline", title:"Technical Project",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Data Integration</div>
      <h2>Three sources, one keyed dataset</h2>
      <p class="sub">File + API + web data, combined through normalized keys with explicit handling for request failures and unmatched records.</p>

      <div class="grid g3" style="margin-top:22px;flex:none">
        <div class="card"><span class="eyebrow">Source 01 · File</span><h3>CSV import</h3><p class="stat-n">Master catalogue loaded with pandas, the spine every other source joins to.</p></div>
        <div class="card"><span class="eyebrow">Source 02 · API</span><h3>Open Library REST</h3><p class="stat-n">Publication year per title, with timeout, status checking, and typed exception handling.</p></div>
        <div class="card"><span class="eyebrow">Source 03 · Scrape</span><h3>BeautifulSoup</h3><p class="stat-n">Price and stock parsed from a static catalogue page.</p></div>
      </div>

      <div class="grid g2" style="margin-top:18px;flex:1">
        <div class="card">
          <span class="eyebrow">Pipeline design</span>
          <h3>Keep the master list intact</h3>
          <ul style="margin-top:12px">
            <li>Normalize join keys with <b>lowercase + trim</b>.</li>
            <li>Use composite key <b>(title, author)</b> where title alone is not unique.</li>
            <li>Use left joins so unmatched rows remain visible instead of silently disappearing.</li>
            <li>The brief asked for two data-quality issues; I reported <b>three</b>.</li>
          </ul>
        </div>
        <div class="card warn">
          <span class="eyebrow" style="color:#a8431f">Data quality issue</span>
          <h3>Character encoding corrupted currency values</h3>
          <p style="font-size:13.7px;color:var(--ink2);line-height:1.5;margin-top:12px">
            My output showed <b>Â£51.77</b> instead of <b>£51.77</b>. Review traced the issue to a UTF-8 page being decoded as Latin-1 because the response lacked a charset header.
          </p>
          <div class="callout" style="background:#fff;border-color:#f8d7c7"><b>Fix:</b> set the response encoding explicitly to UTF-8 before parsing.</div>
        </div>
      </div>`
  },

  {
    id:"zomato-case", title:"Delivery Delay Case Study",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Operations Analytics</div>
      <h2 style="max-width:46ch;font-size:27px">3 in 10 deliveries arrived late. I separated what the company can fix from what it can only anticipate.</h2>
      <p class="sub">Zomato delivery data, 11 February to 6 April 2022. Late means more than 30 minutes. Python (Google Colab) for cleaning, Power BI for the dashboard.</p>
      <div class="evidence-links"><a href="https://github.com/fatwaferdiansyah97-dev/zomato-delivery-analysis" target="_blank" rel="noopener">Notebook, Power BI file and slides on GitHub</a></div>
      <div class="grid g4 lc-stats" style="margin-top:14px;flex:none">
        <div class="card"><div class="stat-l">Orders analysed</div><div class="stat sm">45,493</div><div class="stat-n">from 45,584 raw rows</div></div>
        <div class="card"><div class="stat-l">Late rate</div><div class="stat sm">29.9%</div><div class="stat-n">13,585 orders over 30 minutes</div></div>
        <div class="card"><div class="stat-l">Dinner peak</div><div class="stat sm">50.9%</div><div class="stat-n">of late orders, from 30.4% of orders</div></div>
        <div class="card"><div class="stat-l">Data issues</div><div class="stat sm">7</div><div class="stat-n">fixed or documented first</div></div>
      </div>
      <div class="grid g2 lc-body" style="margin-top:14px;flex:1;min-height:0">
        <div class="card good">
          <span class="eyebrow">Data integrity before analysis</span>
          <h3>Some rows were test data, and one ID was not one person</h3>
          <ul style="margin-top:10px">
            <li><b>38</b> couriers aged 15, all rated 1, and <b>53</b> ratings of 6 on a 1 to 5 scale: removed as placeholder data.</li>
            <li><b>3,640</b> zero restaurant coordinates: distance left blank, rows kept.</li>
            <li><b>4,068</b> mixed time formats, including Excel fractions: standardised.</li>
            <li><b>1,320</b> courier IDs with more than one age, so I did <b>not</b> rank individual couriers.</li>
          </ul>
        </div>
        <div class="card tint">
          <span class="eyebrow">What drives late orders</span>
          <h3>Batching and dinner-time traffic, not the type of food</h3>
          <ul style="margin-top:10px">
            <li><b>2 or more extra orders</b> per trip: 100% late in every traffic condition.</li>
            <li><b>Traffic jam with fog or cloudy weather:</b> 75.5% late.</li>
            <li><b>Poor-condition motorcycles:</b> 41.7% late, 46% of all late orders.</li>
            <li><b>Order type</b> barely matters: 29.7% to 30.1% late.</li>
          </ul>
          <div class="callout"><b>Recommendation:</b> cap batching at 1 extra order and add couriers at the dinner peak. These are associations, so each change should be piloted in one city first.</div>
        </div>
      </div>`
  },

  {
    id:"lc-dash", title:"Credit Risk Dashboard",
    html:`
      <div class="project-badge portfolio">Portfolio Project · Tableau Public</div>
      <h2 style="max-width:46ch;font-size:27px">An interactive Tableau story, from the cohort trend to the verification paradox.</h2>
      <p class="sub">Two of the four scenes are shown here.
        <a href="https://public.tableau.com/shared/KF5Y2HRP4?:display_count=n&amp;:origin=viz_share_link" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700;text-decoration:none">Open the live dashboard on Tableau Public &rarr;</a></p>
      <div class="shots two">

/* ---------- Future project renderer ---------- */
function futureProjectToSlide(p, index){
  const toolTags = (p.tools || []).map(x => `<span class="tag b">${x}</span>`).join("");
  return {
    id:`future-${index+1}`,
    html:`
      <div class="project-badge portfolio">Portfolio Project · Assignment ${String(index+1).padStart(2,"0")}</div>
      <h2>${p.title}</h2>
      <p class="sub">${p.summary || "Assignment case study, to be expanded with the guide, dataset, solution, and result."}</p>
      <div class="grid g2" style="margin-top:20px;flex:1">
        <div class="card">
          <span class="eyebrow">Business question / assignment brief</span>
          <p style="font-size:13.8px;color:var(--ink2);line-height:1.5">${p.assignmentGuide || "Add the assignment brief here."}</p>
          <div style="margin-top:15px">${toolTags}</div>
        </div>
        <div class="card good">
          <span class="eyebrow">Result & evidence</span>
          <p style="font-size:13.8px;color:var(--ink2);line-height:1.5">${p.result || "Add the key finding, recommendation, and evidence here."}</p>
          <div class="callout"><b>Evidence:</b> ${p.evidence || "Add links or file references after upload."}</div>
        </div>
      </div>`
  };
}

const futureSlides = futureProjects.map(futureProjectToSlide);
const ORDER = ["cover", "impact", "proc-method", "proc-findings", "proc-dash", "zomato-case", "zomato-dash", "lc-overview", "lc-verification", "lc-dash", "rfm-segments", "rfm-dash", "ab-results", "more-work", "skills", "contact", "appendix", "retail-build", "retail-findings", "hr", "sql-database", "sql-implementation", "ab-monitoring", "rfm-recommendations", "olist-overview", "olist-technical", "pipeline", "approach"];
const byId = Object.fromEntries(slides.map(x => [x.id, x]));
const deck = [...ORDER.map(id => byId[id]), ...futureSlides];
if (ORDER.some(id => !byId[id])) console.error("Missing slide", ORDER.filter(id => !byId[id]));

/* ---------- Render ---------- */
const stage = document.getElementById("stage");
const pg = document.getElementById("pg");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

deck.forEach((p, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (p.cls || "");
  el.dataset.index = i;
  el.dataset.slideId = p.id;
  el.setAttribute("aria-label", `${i + 1} of ${deck.length}: ${p.title || p.id}`);
  el.innerHTML = p.html + (p.foot === false ? "" :
    `<div class="foot"><span>${ME.name} · ${ME.role}</span><span>${String(i + 1).padStart(2,"0")} / ${String(deck.length).padStart(2,"0")}</span></div>`);
  stage.appendChild(el);
});

let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(deck.length - 1, i));
  [...stage.children].forEach((s,j) => s.classList.toggle("on", j === cur));
  pg.textContent = `${cur + 1} / ${deck.length}`;
  prev.disabled = cur === 0;
  next.disabled = cur === deck.length - 1;
  prev.setAttribute("aria-disabled", String(cur === 0));
  next.setAttribute("aria-disabled", String(cur === deck.length - 1));
  window.scrollTo({top:0, behavior:"smooth"});
}

prev.onclick = () => show(cur - 1);
next.onclick = () => show(cur + 1);

document.addEventListener("keydown", e => {
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(cur+1)}
  if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(cur-1)}
  if(e.key === "Home"){e.preventDefault();show(0)}
  if(e.key === "End"){e.preventDefault();show(deck.length-1)}
});

show(0);


/* ---------- Jump links (cards, appendix, hash) ---------- */
function goTo(id){
  const i = deck.findIndex(x => x.id === id);
  if(i >= 0){ show(i); history.replaceState(null, "", "#" + id); }
}
stage.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if(!t) return;
  e.preventDefault();
  goTo(t.dataset.go);
});
if(location.hash){ goTo(location.hash.slice(1)); }

/* ---------- Scale the 1280x720 slide to fit any window ---------- */
function fitDeck(){
  const vw = document.documentElement.clientWidth;
  const vh = window.innerHeight;
  if(vw <= 900){ document.documentElement.style.setProperty("--s", "1"); return; }
  const s = Math.min((vw - 40) / 1280, (vh - 40) / 720, 1.45);
  document.documentElement.style.setProperty("--s", String(Math.max(s, 0.25)));
}
window.addEventListener("resize", fitDeck);
window.addEventListener("orientationchange", fitDeck);
fitDeck();
</script>
